<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peta Lokasi — Rumah Mempelai, Gang 99</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:ital@1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #efe9db;
        --ink: #4e5c38;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px 16px;
        background: var(--bg);
        font-family: "DM Sans", system-ui, sans-serif;
        color: var(--ink);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .map {
        width: 100%;
        max-width: 880px;
        box-shadow: 0 6px 24px rgba(118, 84, 58, 0.12);
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .bar {
        display: flex;
        gap: 10px;
      }
      button {
        font:
          500 14px "DM Sans",
          system-ui,
          sans-serif;
        color: var(--ink);
        background: #fffdf6;
        border: 1px solid #a8b58a;
        border-radius: 999px;
        padding: 9px 18px;
        cursor: pointer;
      }
      button:hover {
        background: #f4f1e4;
      }
      @media print {
        body {
          background: #fff;
          padding: 0;
        }
        .bar {
          display: none;
        }
        .map {
          box-shadow: none;
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="map">
      <svg
        id="peta"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="150 -110 1150 940"
        font-family="'DM Sans',system-ui,sans-serif"
      >
        <defs>
          <clipPath id="clip">
            <rect x="166" y="0" width="1118" height="800" />
          </clipPath>
          <path id="ar" d="M-8,0H8 M2,-5L8,0L2,5" />
          <!-- Lucide-style icons, 24x24 grid -->
          <g id="i-mosque">
            <path d="M2 21h20" />
            <path d="M7 21v-5a5 5 0 0 1 10 0v5" />
            <path d="M12 11V8" />
            <path d="M2 21V11l1.5-3L5 11v10" />
            <path d="M19 21V11l1.5-3L22 11v10" />
          </g>
          <g id="i-package">
            <path
              d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"
            />
            <path d="M12 22V12" />
            <polyline points="3.29 7 12 12 20.71 7" />
            <path d="m7.5 4.27 9 5.15" />
          </g>
          <g id="i-landmark">
            <line x1="3" x2="21" y1="22" y2="22" />
            <line x1="6" x2="6" y1="18" y2="11" />
            <line x1="10" x2="10" y1="18" y2="11" />
            <line x1="14" x2="14" y1="18" y2="11" />
            <line x1="18" x2="18" y1="18" y2="11" />
            <polygon points="12 2 20 7 4 7" />
          </g>
          <g id="i-mail">
            <rect width="20" height="16" x="2" y="4" rx="2" />
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
          </g>
          <g id="i-house">
            <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
            <path
              d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
            />
          </g>
        </defs>

        <rect x="150" y="-110" width="1150" height="940" fill="#fbf7ee" />
        <rect
          x="166"
          y="-94"
          width="1118"
          height="908"
          fill="none"
          stroke="#d6cfbc"
          stroke-width="1.2"
        />
        <text
          x="725"
          y="-38"
          text-anchor="middle"
          font-family="'Playfair Display',Georgia,serif"
          font-style="italic"
          font-size="38"
          fill="#76543a"
        >
          Petunjuk Lokasi
        </text>
        <line
          x1="166"
          y1="0"
          x2="1284"
          y2="0"
          stroke="#d6cfbc"
          stroke-width="1.2"
        />

        <g
          clip-path="url(#clip)"
          fill="none"
          stroke-linecap="butt"
          stroke-linejoin="round"
        >
          <!-- casings -->
          <path d="M524,-20 L1178,830" stroke="#bdb398" stroke-width="117.6" />
          <g stroke="#d6cfbc" stroke-width="11">
            <path d="M800,415 L545,628 L300,798" />
            <path d="M858,466 L585,672" />
            <path d="M930,425 L1175,235" />
          </g>
          <!-- fills -->
          <path d="M524,-20 L1178,830" stroke="#ece6d5" stroke-width="114" />
          <path d="M524,-20 L1178,830" stroke="#c9c0a6" stroke-width="1.3" />
          <g stroke="#f6f2e7" stroke-width="9.4">
            <path d="M806,410 L545,628 L300,798" />
            <path d="M864,461 L585,672" />
            <path d="M936,421 L1175,235" />
          </g>

          <!-- routes: from Banjarbaru (SW lane, turn left) and from Banjarmasin (NE lane, cross over) -->
          <g stroke-linecap="round">
            <path
              id="r1"
              d="M1120,800 L848,447 Q815,403 800,415 L545,628"
              stroke="#a8b58a"
              stroke-width="11"
              opacity=".38"
            />
            <path
              id="r2"
              d="M575,0 L846,352 Q856,368 800,415 L545,628"
              stroke="#a8b58a"
              stroke-width="11"
              opacity=".38"
            />
            <path
              d="M1120,800 L848,447 Q815,403 800,415 L545,628"
              stroke="#68794d"
              stroke-width="4.5"
            />
            <path
              d="M575,0 L846,352 Q856,368 800,415 L545,628"
              stroke="#68794d"
              stroke-width="4.5"
            />
          </g>

          <!-- direction arrows: NE lane = BJM→BJB (SE), SW lane = BJB→BJM (NW) -->
          <g stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <g stroke="#fffdf6">
              <use href="#ar" transform="translate(660,110) rotate(52.3)" />
              <use href="#ar" transform="translate(768,250) rotate(52.3)" />
              <use href="#ar" transform="translate(920,540) rotate(232.3)" />
              <use href="#ar" transform="translate(1005,650) rotate(232.3)" />
              <use href="#ar" transform="translate(1082,750) rotate(232.3)" />
            </g>
            <g stroke="#8a8068">
              <use href="#ar" transform="translate(960,500) rotate(52.3)" />
              <use href="#ar" transform="translate(1114,700) rotate(52.3)" />
              <use href="#ar" transform="translate(620,150) rotate(232.3)" />
              <use href="#ar" transform="translate(728,290) rotate(232.3)" />
            </g>
          </g>
          <g
            font-size="12.5"
            fill="#8a8068"
            letter-spacing="1.4"
            text-anchor="middle"
            font-weight="500"
          >
            <text transform="translate(1030,590) rotate(52.3)" dy="4.5">
              BJM → BJB
            </text>
            <text transform="translate(535,40) rotate(52.3)" dy="4.5">
              BJM ← BJB
            </text>
          </g>
        </g>

        <!-- north -->
        <g
          stroke="#a89f86"
          stroke-width="1.4"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M1236,78 V40 M1229,49 L1236,38 L1243,49" />
        </g>
        <text
          x="1236"
          y="30"
          text-anchor="middle"
          font-size="14"
          fill="#8a8068"
          letter-spacing="1"
        >
          U
        </text>

        <!-- landmark icons -->
        <g
          fill="none"
          stroke="#68794d"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <g transform="translate(416,208)">
            <circle r="18" fill="#fffdf6" stroke-width="1.1" stroke="#cfc8b4" />
            <g transform="scale(.9) translate(-12,-12)">
              <use href="#i-mosque" />
            </g>
          </g>
          <g transform="translate(772,488)">
            <circle r="18" fill="#fffdf6" stroke-width="1.1" stroke="#cfc8b4" />
            <g transform="scale(.9) translate(-12,-12)">
              <use href="#i-package" />
            </g>
          </g>
          <g transform="translate(1103,240)">
            <circle r="18" fill="#fffdf6" stroke-width="1.1" stroke="#cfc8b4" />
            <g transform="scale(.9) translate(-12,-12)">
              <use href="#i-landmark" />
            </g>
          </g>
          <g transform="translate(922,607)">
            <circle r="18" fill="#fffdf6" stroke-width="1.1" stroke="#cfc8b4" />
            <g transform="scale(.9) translate(-12,-12)">
              <use href="#i-mail" />
            </g>
          </g>
        </g>
        <g font-size="17" fill="#76543a" letter-spacing=".4">
          <text x="390" y="214" text-anchor="end">Masjid Mujahidin</text>
          <text x="746" y="494" text-anchor="end">DHL</text>
          <text x="1128" y="236">Plaza Pelayanan</text>
          <text x="1128" y="258">Publik</text>
          <text x="896" y="613" text-anchor="end">Kantor Pos</text>
        </g>

        <!-- destination -->
        <path
          d="M545,648 L553,706"
          stroke="#68794d"
          stroke-width="1.2"
          fill="none"
        />
        <circle
          cx="545"
          cy="628"
          r="25"
          fill="none"
          stroke="#68794d"
          stroke-width="1.1"
          opacity=".5"
        />
        <circle cx="545" cy="628" r="20" fill="#68794d" />
        <g
          transform="translate(545,628) scale(.85) translate(-12,-12)"
          fill="none"
          stroke="#fffdf6"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <use href="#i-house" />
        </g>
        <rect
          x="528"
          y="706"
          width="262"
          height="36"
          rx="18"
          fill="#fffdf6"
          stroke="#68794d"
          stroke-width="1.2"
        />
        <text
          x="659"
          y="729"
          text-anchor="middle"
          font-size="16.5"
          font-weight="500"
          fill="#4e5c38"
          letter-spacing=".3"
        >
          Rumah Mempelai — Gang 99
        </text>
      </svg>
    </div>
    <div class="bar">
      <button onclick="dl()">Unduh SVG</button>
      <button onclick="window.print()">Cetak / Simpan PDF</button>
    </div>
    <script>
      function dl() {
        var s = new XMLSerializer().serializeToString(
          document.getElementById("peta"),
        );
        var a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([s], { type: "image/svg+xml" }));
        a.download = "peta-lokasi-mempelai.svg";
        a.click();
      }
    </script>
  </body>
</html>
