<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kartu Peta Lokasi — 10 kartu per A4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --sun: #f6c945;
        --honey: #d9a441;
        --sage: #a8b58a;
        --olive: #68794d;
        --brown: #76543a;
        --peach: #f5c6a5;
        --cream: #fff8e7;
        --paper: #fffdf5;
        /* WARNA KERTAS KARTU: putih (default). Warna asal: --card-paper:#fffdf5; --card-dots:radial-gradient(rgba(118,84,58,.07) .25mm,transparent .3mm); --map-paper:#fbf7ee; */
        --card-paper: #ffffff;
        --card-dots: none;
        --map-paper: #ffffff;
        --ink: #5e4230;
        --f-serif: "Cormorant Garamond", Georgia, serif;
        --f-display: "Playfair Display", Georgia, serif;
        --f-ui: "DM Sans", system-ui, sans-serif;
        --s: 1;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #eee8dc;
        color: var(--ink);
        font-family: var(--f-ui);
        -webkit-font-smoothing: antialiased;
      }
      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      h1,
      p {
        margin: 0;
      }
      .ui {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px 16px 8px;
      }
      .ui-card {
        background: var(--cream);
        border: 2px solid var(--brown);
        border-radius: 16px;
        box-shadow: 4px 6px 0 var(--sage);
        padding: 18px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .ui h1 {
        font-family: var(--f-display);
        font-weight: 500;
        font-size: clamp(1.4rem, 4.6vw, 2rem);
        color: var(--brown);
        line-height: 1.15;
      }
      .ui .sub {
        margin-top: 4px;
        font-size: 0.9rem;
        color: var(--olive);
      }
      .btn {
        min-height: 48px;
        padding: 0.7em 1.7em;
        font: 700 1rem var(--f-ui);
        letter-spacing: 0.12em;
        background: var(--olive);
        color: var(--cream);
        border: 2px solid var(--brown);
        border-radius: 999px;
        box-shadow: 2px 3px 0 var(--brown);
        cursor: pointer;
      }
      .btn:hover {
        background: #788b58;
      }
      .paper {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--brown);
      }
      .tabs {
        display: inline-flex;
        border: 2px solid var(--brown);
        border-radius: 999px;
        overflow: hidden;
        background: var(--paper);
      }
      .tabs button {
        border: 0;
        background: none;
        min-height: 40px;
        padding: 0.4em 1.1em;
        font: 700 0.88rem var(--f-ui);
        color: var(--brown);
        cursor: pointer;
      }
      .tabs button + button {
        border-left: 2px solid var(--brown);
      }
      .tabs button[aria-pressed="true"] {
        background: var(--sage);
        color: var(--ink);
      }
      .paper label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .paper input[type="color"] {
        width: 40px;
        height: 34px;
        padding: 0;
        border: 2px solid var(--brown);
        border-radius: 8px;
        background: none;
        cursor: pointer;
      }
      #stage {
        padding: 18px 16px 56px;
        display: flex;
        justify-content: center;
      }
      .scaler {
        width: calc(210mm * var(--s));
        height: calc(297mm * var(--s));
        position: relative;
        background: #fff;
        box-shadow:
          0 14px 30px -12px rgba(94, 66, 48, 0.55),
          0 2px 6px rgba(94, 66, 48, 0.2);
      }
      .sheet {
        position: absolute;
        left: 0;
        top: 0;
        width: 210mm;
        height: 297mm;
        transform-origin: 0 0;
        transform: scale(var(--s));
      }
      .grid {
        position: absolute;
        left: 7mm;
        top: 11mm;
        display: grid;
        grid-template-columns: repeat(2, 98mm);
        grid-auto-rows: 55mm;
      }
      .marks {
        position: absolute;
        inset: 0;
        width: 210mm;
        height: 297mm;
        pointer-events: none;
      }

      /* ---- one card: same "postcard" look as the invitation's location card ---- */
      .card {
        width: 98mm;
        height: 55mm;
        padding: 1.8mm;
        background: repeating-linear-gradient(
          -45deg,
          var(--peach) 0 3mm,
          var(--cream) 3mm 6mm,
          var(--sage) 6mm 9mm,
          var(--cream) 9mm 12mm
        );
      }
      .pc-in {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        background-color: var(--card-paper);
        background-image: var(--card-dots);
        background-size: 2mm 2mm;
        overflow: hidden;
      }
      .hd {
        flex: none;
        padding: 2.2mm 3mm 0;
        display: flex;
        justify-content: center;
      }
      .row1 {
        display: flex;
        align-items: center;
        gap: 1.4mm;
        white-space: nowrap;
      }
      .row1 .pin {
        width: 3.8mm;
        height: 3.8mm;
        flex: none;
      }
      .addr {
        font: 700 4.3mm/1 var(--f-serif);
        letter-spacing: 0.15mm;
        color: var(--brown);
      }
      .mapbox {
        flex: 1;
        min-height: 0;
        margin: 1.5mm 1.7mm 1.7mm;
        background: var(--map-paper);
        border: 0.25mm solid var(--sage);
        border-radius: 1.2mm;
        overflow: hidden;
      }
      .mapbox svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      @page {
        size: A4 portrait;
        margin: 0;
      }
      @media print {
        html,
        body {
          margin: 0;
          padding: 0;
          background: #fff !important;
        }
        .ui {
          display: none !important;
        }
        #stage {
          padding: 0;
          display: block;
        }
        .scaler {
          width: 210mm !important;
          height: 297mm !important;
          box-shadow: none !important;
        }
        .sheet {
          transform: none !important;
        }
      }
    </style>
  </head>

    <header class="ui">
      <div class="ui-card">
        <div>
          <h1>Kartu Peta Lokasi</h1>
          <p class="sub">
            10 kartu per A4 (98 × 55 mm) · cetak A4 Portrait, margin None, skala
            100%, centang Background graphics · potong mengikuti tanda di tepi
            kertas
          </p>
          <div class="paper">
            <span>Warna kertas:</span>
            <div
              class="tabs"
              id="paperTabs"
              role="group"
              aria-label="Warna kertas"
            >
              <button type="button" data-paper="putih" aria-pressed="true">
                Putih (hemat tinta)
              </button>
              <button type="button" data-paper="asal" aria-pressed="false">
                Warna asal
              </button>
            </div>
            <label

                type="color"
                id="paperColor"
                value="#ffffff"
                aria-label="Pilih warna kertas"
            /></label>
          </div>
        </div>
        <button class="btn" id="printBtn" type="button">CETAK</button>
      </div>
    </header>

    <main id="stage">

        <div class="sheet" id="sheet">
          <svg

            id="marks"
            viewBox="0 0 210 297"
            aria-hidden="true"
          ></svg>
          <div class="grid" id="grid"></div>
        </div>
      </div>
    </main>

                <path

    <script>
      (function () {
        "use strict";
        var NS = "http://www.w3.org/2000/svg",
          MM = 96 / 25.4;
        function mk(t, a, p) {
          var e = document.createElementNS(NS, t);
          for (var k in a) e.setAttribute(k, a[k]);
          p.appendChild(e);
          return e;
        }
        var i;
        // 10 cards
        var grid = document.getElementById("grid"),
          tpl = document.getElementById("tpl");
        for (i = 0; i < 10; i++) grid.appendChild(tpl.content.cloneNode(true));

        // cut marks in the margins (grid: x 7/105/203, y 11 + 55n)
        var m = document.getElementById("marks"),
          xs = [7, 105, 203],
          ys = [11, 66, 121, 176, 231, 286];
        function ln(x1, y1, x2, y2) {
          mk(
            "line",
            {
              x1: x1,
              y1: y1,
              x2: x2,
              y2: y2,
              stroke: "#76543a",
              "stroke-width": 0.2,
            },
            m,
          );
        }
        xs.forEach(function (x) {
          ln(x, 3, x, 8);
          ln(x, 289, x, 294);
        });
        ys.forEach(function (y) {
          ln(1.5, y, 5.5, y);
          ln(204.5, y, 208.5, y);
        });

        // paper colour: white (default) / original / custom
        var PAPERS = {
          putih: { paper: "#ffffff", dots: "none", map: "#ffffff" },
          asal: {
            paper: "#fffdf5",
            dots: "radial-gradient(rgba(118,84,58,.07) .25mm,transparent .3mm)",
            map: "#fbf7ee",
          },
        };
        var colorIn = document.getElementById("paperColor"),
          tabs = document.querySelectorAll("#paperTabs button");
        function setPaper(mode, color, save) {
          var c =
              mode === "custom"
                ? { paper: color, dots: "none", map: color }
                : PAPERS[mode],
            r = document.documentElement.style;
          r.setProperty("--card-paper", c.paper);
          r.setProperty("--card-dots", c.dots);
          r.setProperty("--map-paper", c.map);
          colorIn.value = c.paper;
          Array.prototype.forEach.call(tabs, function (b) {
            b.setAttribute("aria-pressed", String(b.dataset.paper === mode));
          });
          if (save) {
            try {
              localStorage.setItem(
                "kartuPaper",
                JSON.stringify({ mode: mode, color: color || "" }),
              );
            } catch (e) {}
          }
        }
        Array.prototype.forEach.call(tabs, function (b) {
          b.addEventListener("click", function () {
            setPaper(b.dataset.paper, null, true);
          });
        });
        colorIn.addEventListener("input", function () {
          setPaper("custom", colorIn.value, true);
        });
        var saved = null;
        try {
          saved = JSON.parse(localStorage.getItem("kartuPaper"));
        } catch (e) {}
        if (
          saved &&
          saved.mode === "custom" &&
          /^#[0-9a-f]{6}$/i.test(saved.color)
        )
          setPaper("custom", saved.color, false);
        else if (saved && PAPERS[saved.mode]) setPaper(saved.mode, null, false);
        else setPaper("putih", null, false);

        // screen preview scale
        function layout() {
          var s = Math.min(
            1,
            (document.getElementById("stage").clientWidth - 32) / (210 * MM),
          );
          document
            .getElementById("stage")
            .style.setProperty("--s", Math.max(0.3, s).toFixed(4));
        }
        window.addEventListener("resize", layout);
        layout();
        document
          .getElementById("printBtn")
          .addEventListener("click", function () {
            window.print();
          });
      })();
    </script>
  </body>
</html>
