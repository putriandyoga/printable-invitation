<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buku Tamu Lengkap — Putri &amp; Yoga (A4 Landscape)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:wght@400;500;700&family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cream: #fff8e7;
        --vanilla: #fff1cc;
        --honey: #d9a441;
        --sage: #a8b58a;
        --olive: #68794d;
        --brown: #76543a;
        --f-serif: "Cormorant Garamond", Georgia, serif;
        --f-display: "Playfair Display", Georgia, serif;
        --f-ui: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        --s: 1;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: #e9e4d9;
        color: var(--brown);
        font-family: var(--f-ui);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      p {
        margin: 0;
      }

      /* ---------- Screen-only controls ---------- */
      .ui {
        max-width: 1000px;
        margin: 0 auto;
        padding: 16px 16px 4px;
      }
      .ui-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        background: var(--cream);
        border: 2px solid var(--brown);
        border-radius: 14px;
        padding: 12px 18px;
      }
      .ui-card p {
        font-size: 0.92rem;
        max-width: 66ch;
      }
      .opts {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .opts label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
      }
      .opts input {
        width: 64px;
        padding: 4px 6px;
        border: 1px solid var(--sage);
        border-radius: 6px;
        font: 0.9rem var(--f-ui);
        background: #fff;
      }
      .btn {
        min-height: 46px;
        padding: 0.6em 1.6em;
        font: 700 0.95rem var(--f-ui);
        background: var(--olive);
        color: var(--cream);
        border: 2px solid var(--brown);
        border-radius: 999px;
        cursor: pointer;
      }
      .btn:hover {
        background: #788b58;
      }
      .btn:focus-visible {
        outline: 3px solid var(--olive);
        outline-offset: 3px;
      }

      /* ---------- Preview ---------- */
      #stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        padding: 14px 16px 32px;
      }
      .cap {
        font: 700 0.78rem var(--f-ui);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--olive);
        margin: 0 0 8px;
      }
      .scaler {
        position: relative;
        width: calc(297mm * var(--s));
        height: calc(210mm * var(--s));
        background: #fff;
        box-shadow:
          0 14px 30px -12px rgba(94, 66, 48, 0.55),
          0 2px 6px rgba(94, 66, 48, 0.2);
      }
      .page {
        position: absolute;
        left: 0;
        top: 0;
        width: 297mm;
        height: 210mm;
        overflow: hidden;
        transform-origin: 0 0;
        transform: scale(var(--s));
        background-color: var(--cream);
        background-image: radial-gradient(
          rgba(118, 84, 58, 0.07) 0.25mm,
          transparent 0.3mm
        );
        background-size: 2mm 2mm;
      }
      .page.cover {
        background-image:
          radial-gradient(circle at 50% 42%, #fffdf2 0, transparent 65%),
          radial-gradient(rgba(118, 84, 58, 0.07) 0.25mm, transparent 0.3mm);
        background-size:
          100% 100%,
          2mm 2mm;
      }
      .art {
        position: absolute;
        left: 0;
        top: 0;
        width: 297mm;
        height: 210mm;
        display: block;
        z-index: 1;
      }

      /* ---------- Mini postcards (3 x 2 per page) ---------- */
      .cards {
        position: absolute;
        left: 16mm;
        top: 44mm;
        width: 265mm;
        height: 137mm;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 8mm;
      }
      .pcard {
        position: relative;
        padding: 2mm;
        background: repeating-linear-gradient(
          -45deg,
          #f5c6a5 0 3mm,
          var(--cream) 3mm 6mm,
          var(--sage) 6mm 9mm,
          var(--cream) 9mm 12mm
        );
        box-shadow: 0.3mm 0.5mm 1mm rgba(118, 84, 58, 0.15);
      }
      .pcard:nth-child(odd) {
        rotate: -0.5deg;
      }
      .pcard:nth-child(even) {
        rotate: 0.5deg;
      }
      .pc-in {
        height: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 27mm;
        background-color: #fffdf5;
        background-image: radial-gradient(
          rgba(118, 84, 58, 0.07) 0.25mm,
          transparent 0.3mm
        );
        background-size: 2mm 2mm;
      }
      .pc-l {
        display: flex;
        flex-direction: column;
        padding: 3mm 3mm 3mm 4mm;
        min-width: 0;
      }
      .pc-l .ttl {
        font-family: "Dancing Script", cursive;
        font-weight: 700;
        font-size: 5.2mm;
        line-height: 1;
        color: var(--olive);
      }
      .pc-l .lines {
        flex: 1;
        margin-top: 1mm;
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0 7.3mm,
          rgba(168, 181, 138, 0.95) 7.3mm 7.6mm
        );
      }
      .pc-r {
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 3mm 3.5mm 3mm 3.5mm;
        border-left: 0.3mm dashed rgba(118, 84, 58, 0.45);
      }
      .stamp {
        align-self: flex-end;
        width: 13mm;
        height: 15.5mm;
        padding: 1mm;
        background: #fff;
        border: 0.45mm dotted var(--honey);
        outline: 0.25mm solid rgba(217, 164, 65, 0.5);
        outline-offset: -1.2mm;
      }
      .stamp svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .fld {
        margin-top: auto;
      }
      .fld + .fld {
        margin-top: 3mm;
      }
      .fld span {
        display: block;
        font: 700 2.1mm/1 var(--f-ui);
        letter-spacing: 0.35mm;
        text-transform: uppercase;
        color: var(--olive);
      }
      .fld i {
        display: block;
        height: 6.2mm;
        border-bottom: 0.3mm dotted var(--honey);
      }
      .pc-r .hrt {
        position: absolute;
        left: 3.5mm;
        top: 3.5mm;
        width: 3.4mm;
        height: 3.4mm;
        color: #e9a88a;
      }
      .pc-r .hrt svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* ---------- Print ---------- */
      @page {
        size: A4 landscape;
        margin: 0;
      }
      @media print {
        :root {
          --s: 1 !important;
        }
        html,
        body {
          margin: 0;
          padding: 0;
          background: #fff !important;
          width: 297mm;
        }
        .ui,
        .cap {
          display: none !important;
        }
        #stage {
          display: block;
          padding: 0;
          gap: 0;
        }
        .side {
          display: block;
        }
        .scaler {
          width: 297mm;
          height: 209.6mm;
          box-shadow: none;
          overflow: hidden;
          break-after: page;
          page-break-after: always;
          break-inside: avoid;
        }
        .side:last-child .scaler {
          break-after: auto;
          page-break-after: auto;
        }
        .page {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="ui">
      <div class="ui-card">
        <div>
          <p>
            <strong>Buku Tamu lengkap, A4 landscape:</strong> cover depan →
            halaman isi → cover belakang. Cetak dengan kertas A4, Landscape,
            margin None, skala 100%, Background graphics aktif. Setiap halaman
            isi memuat 6 kartu pos mini, jadi 10 halaman = 60 tamu.
          </p>
          <div class="opts">
            <label
              >Jumlah halaman isi
              <input id="pgs" type="number" min="1" max="60" value="10"
            /></label>
          </div>
        </div>
        <button class="btn" id="printBtn" type="button">
          Cetak / Simpan PDF
        </button>
      </div>
    </header>

    <main id="stage"></main>

    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs id="defs"></defs>
    </svg>

    <script>
      (function () {
        /* =====================  CONFIGURATION  ===================== */
        var CFG = {
          pages: 10, // number of inside (guest list) pages
          bride: "PUTRI",
          groom: "YOGA",
          initials: "P",
          initials2: "Y",
          date: "17 JANUARI 2027",
          title: "Buku Tamu",
          tagline: "Doa & ucapan untuk kebahagiaan kami",
          hint: "Silakan tuliskan nama, ucapan dan doa Anda",
          thanks: "Terima kasih telah menjadi bagian dari hari bahagia kami",
          insideThanks: "Terima kasih atas doa dan kehadiran Anda",
          cardTitle: "Ucapan & Doa",
          fromLabel: "Dari",
          originLabel: "Asal / Alamat",
        };
        /* ========================================================= */

        var f = function (n) {
          return Math.round(n * 100) / 100;
        };
        var esc = function (t) {
          return String(t).replace(/&/g, "&amp;");
        };

        /* ---- Vector symbols (same as all other designs) ---- */
        function sunflower() {
          var s =
              '<symbol id="sf" viewBox="-50 -50 100 100"><g fill="#D9A441">',
            i;
          for (i = 0; i < 14; i++)
            s +=
              '<ellipse cx="0" cy="-33" rx="8.2" ry="17" transform="rotate(' +
              (i * 360) / 14 +
              ')"/>';
          s += '</g><g fill="#F6C945">';
          for (i = 0; i < 14; i++)
            s +=
              '<ellipse cx="0" cy="-31" rx="7.6" ry="15.5" transform="rotate(' +
              ((i + 0.5) * 360) / 14 +
              ')"/>';
          s += "</g>";
          for (i = 0; i < 14; i++)
            s +=
              '<path d="M0 -20V-42" stroke="#D9A441" stroke-width=".9" opacity=".55" stroke-linecap="round" fill="none" transform="rotate(' +
              ((i + 0.5) * 360) / 14 +
              ')"/>';
          s +=
            '<circle r="18" fill="#76543A"/><circle r="14.5" fill="#5E4230"/>';
          [
            [5, "1.3 3.8"],
            [9, "1.7 4.0"],
            [12.5, "2 4.4"],
          ].forEach(function (a) {
            s +=
              '<circle r="' +
              a[0] +
              '" fill="none" stroke="#D9A441" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="' +
              a[1] +
              '" opacity=".9"/>';
          });
          return s + "</symbol>";
        }
        function daisy() {
          var s = '<symbol id="dz" viewBox="-50 -50 100 100">',
            i;
          for (i = 0; i < 10; i++)
            s +=
              '<ellipse cx="0" cy="-30" rx="7.2" ry="17" fill="#FFFDF5" stroke="#E0CE9A" stroke-width="1.2" transform="rotate(' +
              i * 36 +
              ')"/>';
          return (
            s +
            '<circle r="12" fill="#F6C945" stroke="#D9A441" stroke-width="1.5"/><circle r="5" fill="#D9A441"/></symbol>'
          );
        }
        document.getElementById("defs").innerHTML =
          sunflower() +
          daisy() +
          '<symbol id="leaf" viewBox="0 0 40 28"><path d="M0 14C9 -2 28 -2 40 14 28 30 9 30 0 14Z" fill="#A8B58A"/><path d="M2 14H36" stroke="#68794D" stroke-width="1.3" stroke-linecap="round" opacity=".6"/></symbol>' +
          '<symbol id="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.5 3 5 6.4 5c2 0 3.5 1.1 5.6 3.2C14.1 6.1 15.6 5 17.6 5 21 5 23 8.5 21.6 11.8 19.5 16.4 12 21 12 21z" fill="currentColor"/></symbol>' +
          '<symbol id="bfly" viewBox="0 0 60 40"><path d="M30 20C22 4 6 2 4 12c-1 8 8 12 16 10-6 2-12 6-9 12 3 5 14 2 19-14z" fill="currentColor"/><path d="M30 20C38 4 54 2 56 12c1 8-8 12-16 10 6 2 12 6 9 12-3 5-14 2-19-14z" fill="currentColor"/><circle cx="14" cy="13" r="3" fill="#FFF8E7" opacity=".85"/><circle cx="46" cy="13" r="3" fill="#FFF8E7" opacity=".85"/><path d="M30 12v18" stroke="#76543A" stroke-width="2.4" stroke-linecap="round"/><path d="M30 12q-4-7-8-8M30 12q4-7 8-8" fill="none" stroke="#76543A" stroke-width="1.2" stroke-linecap="round"/></symbol>';

        function bouquet(ax, ay, sx, sy, S) {
          function p(v) {
            return f((v / 100) * S);
          }
          function leaf(l, t, r) {
            var w = (34 / 100) * S,
              h = (w * 28) / 40;
            return (
              '<use href="#leaf" x="' +
              p(l) +
              '" y="' +
              p(t) +
              '" width="' +
              f(w) +
              '" height="' +
              f(h) +
              '" transform="rotate(' +
              r +
              " " +
              f(p(l) + w / 2) +
              " " +
              f(p(t) + h / 2) +
              ')"/>'
            );
          }
          function box(sym, l, t, w) {
            return (
              '<use href="#' +
              sym +
              '" x="' +
              p(l) +
              '" y="' +
              p(t) +
              '" width="' +
              p(w) +
              '" height="' +
              p(w) +
              '"/>'
            );
          }
          return (
            '<g transform="translate(' +
            ax +
            " " +
            ay +
            ") scale(" +
            sx +
            " " +
            sy +
            ')">' +
            leaf(46, 2, 25) +
            leaf(2, 50, 75) +
            leaf(42, 52, -20) +
            box("sf", 0, 0, 62) +
            box("sf", 48, 30, 38) +
            box("sf", 12, 58, 26) +
            box("dz", 62, 6, 15) +
            box("dz", 36, 70, 15) +
            "</g>"
          );
        }
        function corners(S, Sb) {
          Sb = Sb || S;
          return (
            bouquet(3.5, 3.5, 1, 1, S) +
            bouquet(293.5, 3.5, -1, 1, S) +
            bouquet(3.5, 206.5, 1, -1, Sb) +
            bouquet(293.5, 206.5, -1, -1, Sb)
          );
        }
        function deco(sym, x, y, w, rot, color) {
          var h = sym === "bfly" ? f((w * 2) / 3) : w;
          return (
            '<use href="#' +
            sym +
            '" x="' +
            x +
            '" y="' +
            y +
            '" width="' +
            w +
            '" height="' +
            h +
            '" style="color:' +
            color +
            '" transform="rotate(' +
            rot +
            " " +
            f(x + w / 2) +
            " " +
            f(y + h / 2) +
            ')"/>'
          );
        }
        function divider(cx, cy, half) {
          return (
            '<path d="M' +
            (cx - half) +
            " " +
            cy +
            "H" +
            (cx - 7) +
            "M" +
            (cx + 7) +
            " " +
            cy +
            "H" +
            (cx + half) +
            '" stroke="#D9A441" stroke-width=".4" stroke-linecap="round" opacity=".85"/>' +
            '<circle cx="' +
            (cx - half - 4) +
            '" cy="' +
            cy +
            '" r=".9" fill="#A8B58A"/>' +
            '<circle cx="' +
            (cx + half + 4) +
            '" cy="' +
            cy +
            '" r=".9" fill="#A8B58A"/>' +
            deco("heart", cx - 3.5, cy - 2.4, 7, 0, "#E9A88A")
          );
        }
        function frame() {
          return (
            '<rect x="8" y="8" width="281" height="194" rx="3" fill="none" stroke="#A8B58A" stroke-width=".35"/>' +
            '<rect x="10.4" y="10.4" width="276.2" height="189.2" rx="2" fill="none" stroke="rgba(217,164,65,.8)" stroke-width=".2" stroke-dasharray=".9 .7"/>'
          );
        }
        function svgWrap(inner) {
          return (
            '<svg class="art" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
            inner +
            "</svg>"
          );
        }
        function names(x, y, size, amp, ls) {
          return (
            '<text x="' +
            x +
            '" y="' +
            y +
            '" text-anchor="middle" font-family="Playfair Display,Georgia,serif" font-weight="500" font-size="' +
            size +
            '" letter-spacing="' +
            ls +
            '" fill="#76543A">' +
            CFG.bride +
            ' <tspan font-family="Dancing Script,cursive" font-weight="700" font-size="' +
            amp +
            '" letter-spacing="0" fill="#D9A441">&amp;</tspan> ' +
            CFG.groom +
            "</text>"
          );
        }

        /* ---------------- FRONT COVER ---------------- */
        function front() {
          var cx = 148.5,
            s = frame() + corners(56);
          s +=
            '<use href="#sf" x="' +
            (cx - 14) +
            '" y="20" width="28" height="28"/>';
          s += deco("bfly", cx - 62, 36, 14, -14, "#F5C6A5");
          s += deco("bfly", cx + 48, 36, 14, 14, "#A8B58A");
          s +=
            '<text x="' +
            cx +
            '" y="86" text-anchor="middle" font-family="Dancing Script,cursive" font-weight="700" font-size="30" fill="#68794D">' +
            esc(CFG.title) +
            "</text>";
          s +=
            '<text x="' +
            cx +
            '" y="98" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-style="italic" font-weight="600" font-size="6.6" letter-spacing=".5" fill="#7F9163">' +
            esc(CFG.tagline) +
            "</text>";
          s += divider(cx, 108, 40);
          s += names(cx, 132, 19, 22, 1);
          s +=
            '<text x="' +
            (cx + 0.8) +
            '" y="147" text-anchor="middle" font-family="DM Sans,sans-serif" font-weight="700" font-size="5" letter-spacing="1.6" fill="#76543A">' +
            CFG.date +
            "</text>";
          s += deco("heart", cx - 90, 100, 5, 0, "#E9A88A");
          s += deco("heart", cx + 85, 100, 5, 0, "#E9A88A");
          s += deco("bfly", cx - 100, 128, 12, 14, "#A8B58A");
          s += deco("bfly", cx + 88, 128, 12, -14, "#F5C6A5");
          s +=
            '<text x="' +
            cx +
            '" y="177" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-style="italic" font-weight="600" font-size="5.2" fill="#68794D">' +
            esc(CFG.hint) +
            "</text>";
          return svgWrap(s);
        }

        /* ---------------- INSIDE PAGE ---------------- */
        function inside() {
          var cx = 148.5,
            s = frame() + corners(36, 22);
          s +=
            '<text x="' +
            cx +
            '" y="22" text-anchor="middle" font-family="Dancing Script,cursive" font-weight="700" font-size="14" fill="#68794D">' +
            esc(CFG.title) +
            "</text>";
          s += names(cx, 31.4, 6, 7, 0.5);
          s +=
            '<path d="M' +
            (cx - 62) +
            " 36.4H" +
            (cx - 36) +
            "M" +
            (cx + 36) +
            " 36.4H" +
            (cx + 62) +
            '" stroke="#D9A441" stroke-width=".3" stroke-linecap="round" opacity=".85"/>' +
            '<circle cx="' +
            (cx - 66) +
            '" cy="36.4" r=".6" fill="#A8B58A"/><circle cx="' +
            (cx + 66) +
            '" cy="36.4" r=".6" fill="#A8B58A"/>';
          s +=
            '<text x="' +
            cx +
            '" y="38" text-anchor="middle" font-family="DM Sans,sans-serif" font-weight="700" font-size="3.2" letter-spacing=".9" fill="#76543A">' +
            CFG.date +
            "</text>";
          s += deco("bfly", cx - 86, 22, 9, -14, "#F5C6A5");
          s += deco("bfly", cx + 77, 22, 9, 14, "#A8B58A");
          s += deco("heart", cx - 78, 31.5, 3.6, 0, "#E9A88A");
          s += deco("heart", cx + 74.4, 31.5, 3.6, 0, "#E9A88A");
          s +=
            '<text x="' +
            cx +
            '" y="190" text-anchor="middle" font-family="Dancing Script,cursive" font-weight="700" font-size="5" fill="#68794D">' +
            esc(CFG.insideThanks) +
            "</text>";
          s += deco("heart", cx - 1.6, 193.6, 3.2, 0, "#E9A88A");
          return svgWrap(s);
        }
        function cards() {
          var h = "";
          for (var i = 0; i < 6; i++)
            h +=
              '<div class="pcard"><div class="pc-in">' +
              '<div class="pc-l"><p class="ttl">' +
              esc(CFG.cardTitle) +
              '</p><div class="lines"></div></div>' +
              '<div class="pc-r">' +
              '<span class="hrt"><svg viewBox="0 0 24 24"><use href="#heart"/></svg></span>' +
              '<div class="stamp"><svg viewBox="0 0 100 100"><use href="#sf" x="0" y="0" width="100" height="100"/></svg></div>' +
              '<div class="fld"><span>' +
              esc(CFG.fromLabel) +
              "</span><i></i></div>" +
              '<div class="fld"><span>' +
              esc(CFG.originLabel) +
              "</span><i></i></div>" +
              "</div></div></div>";
          return '<div class="cards">' + h + "</div>";
        }

        /* ---------------- BACK COVER ---------------- */
        function back() {
          var cx = 148.5,
            cy = 80,
            R = 38,
            s = frame() + corners(44);
          s +=
            '<circle cx="' +
            cx +
            '" cy="' +
            cy +
            '" r="' +
            R +
            '" fill="none" stroke="#A8B58A" stroke-width=".5"/>' +
            '<circle cx="' +
            cx +
            '" cy="' +
            cy +
            '" r="' +
            (R - 9) +
            '" fill="none" stroke="#D9A441" stroke-width=".4" stroke-dasharray="1 1.6"/>';
          for (var i = 0; i < 20; i++) {
            if (i % 5 === 0) continue;
            var a = i * 18,
              rad = (a * Math.PI) / 180,
              px = f(cx + R * Math.sin(rad)),
              py = f(cy - R * Math.cos(rad));
            s +=
              '<g transform="translate(' +
              px +
              " " +
              py +
              ") rotate(" +
              (a + (i % 2 ? 28 : -28)) +
              ')"><use href="#leaf" x="-5" y="-3.5" width="10" height="7"/></g>';
          }
          [
            ["sf", 0, 17],
            ["dz", 90, 12],
            ["sf", 180, 17],
            ["dz", 270, 12],
          ].forEach(function (d) {
            var rad = (d[1] * Math.PI) / 180,
              px = cx + R * Math.sin(rad),
              py = cy - R * Math.cos(rad);
            s +=
              '<use href="#' +
              d[0] +
              '" x="' +
              f(px - d[2] / 2) +
              '" y="' +
              f(py - d[2] / 2) +
              '" width="' +
              d[2] +
              '" height="' +
              d[2] +
              '"/>';
          });
          s +=
            '<text x="' +
            cx +
            '" y="' +
            (cy + 9) +
            '" text-anchor="middle" font-family="Playfair Display,Georgia,serif" font-style="italic" font-weight="500" font-size="27" fill="#76543A">' +
            CFG.initials +
            ' <tspan font-family="Dancing Script,cursive" font-style="normal" font-weight="700" font-size="20" fill="#D9A441">&amp;</tspan> ' +
            CFG.initials2 +
            "</text>";
          s += divider(cx, cy + 18, 12).replace(
            /stroke-width=".4"/g,
            'stroke-width=".3"',
          );
          s +=
            '<text x="' +
            cx +
            '" y="141" text-anchor="middle" font-family="Dancing Script,cursive" font-weight="700" font-size="10" fill="#68794D">' +
            esc(CFG.thanks) +
            "</text>";
          s += divider(cx, 152, 40);
          s += names(cx, 166, 6.4, 7.6, 0.6);
          s +=
            '<text x="' +
            (cx + 0.4) +
            '" y="174" text-anchor="middle" font-family="DM Sans,sans-serif" font-weight="700" font-size="3.4" letter-spacing=".9" fill="#76543A">' +
            CFG.date +
            "</text>";
          s += deco("bfly", cx - 104, 70, 12, -14, "#A8B58A");
          s += deco("bfly", cx + 92, 70, 12, 14, "#F5C6A5");
          s += deco("heart", cx - 92, 100, 4.4, 0, "#E9A88A");
          s += deco("heart", cx + 87.6, 100, 4.4, 0, "#E9A88A");
          return svgWrap(s);
        }

        /* ---------------- assemble: front, inside x N, back ---------------- */
        function sheet(cap, cls, inner) {
          return (
            '<section class="side"><p class="cap">' +
            cap +
            '</p><div class="scaler"><div class="page ' +
            cls +
            '">' +
            inner +
            "</div></div></section>"
          );
        }
        function render() {
          var out = sheet("Cover depan", "cover", front());
          for (var p = 0; p < CFG.pages; p++)
            out += sheet(
              "Isi · halaman " + (p + 1) + " dari " + CFG.pages,
              "",
              inside() + cards(),
            );
          out += sheet("Cover belakang", "cover", back());
          document.getElementById("stage").innerHTML = out;
          fit();
        }

        var MM = 96 / 25.4,
          root = document.documentElement;
        function fit() {
          var avail = Math.max(240, window.innerWidth - 32);
          root.style.setProperty(
            "--s",
            Math.min(1, avail / (297 * MM)).toFixed(4),
          );
        }
        document.getElementById("pgs").addEventListener("input", function (e) {
          var v = parseInt(e.target.value, 10);
          if (v >= 1 && v <= 60) {
            CFG.pages = v;
            render();
          }
        });
        window.addEventListener("resize", fit);
        window.addEventListener("beforeprint", function () {
          root.style.setProperty("--s", "1");
        });
        window.addEventListener("afterprint", fit);
        document
          .getElementById("printBtn")
          .addEventListener("click", function () {
            window.print();
          });
        render();
      })();
    </script>
  </body>
</html>
