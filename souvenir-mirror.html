<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Souvenir Mirror Card — Putri &amp; Yoga (10 × 10 cm)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:wght@400;500;700&family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================================
     SUNFLOWER SOUVENIR CARD: 100 x 100 mm, with a 70 mm round mirror
     Mirror guide (exact): left 15, top 6, right 85, bottom 76 mm.
     Text zone: 77 to 97 mm (inside the 25 mm limit below the mirror).
     ============================================================ */
      :root {
        --sun: #f6c945;
        --butter: #fbe8a6;
        --cream: #fff8e7;
        --vanilla: #fff1cc;
        --honey: #d9a441;
        --sage: #a8b58a;
        --olive: #68794d;
        --brown: #76543a;
        --peach: #f5c6a5;
        --sage-deep: #7f9163; /* same colour as "TOGETHER WITH OUR FAMILIES" on the banner */
        --f-serif: "Cormorant Garamond", Georgia, serif;
        --f-display: "Playfair Display", Georgia, serif;
        --f-script: "Dancing Script", "Brush Script MT", cursive;
        --f-ui: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        --s: 4; /* preview scale, set by JavaScript */
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: #e9e4d9;
        color: var(--brown);
        font-family: var(--f-ui);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      p {
        margin: 0;
      }

      /* ---------- Screen-only controls ---------- */
      .ui {
        max-width: 760px;
        margin: 0 auto;
        padding: 16px 16px 4px;
      }
      .ui-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        background: var(--cream);
        border: 2px solid var(--brown);
        border-radius: 14px;
        padding: 12px 18px;
      }
      .ui p {
        font-size: 0.92rem;
        max-width: 52ch;
      }
      .btn {
        min-height: 46px;
        padding: 0.6em 1.6em;
        font: 700 0.95rem var(--f-ui);
        background: var(--olive);
        color: var(--cream);
        border: 2px solid var(--brown);
        border-radius: 999px;
        cursor: pointer;
      }
      .btn:hover {
        background: #788b58;
      }
      .btn:focus-visible {
        outline: 3px solid var(--olive);
        outline-offset: 3px;
      }
      .ui label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
        margin-top: 8px;
      }

      /* ---------- Preview stage ---------- */
      #stage {
        display: flex;
        justify-content: center;
        padding: 14px 16px 32px;
      }
      /* .scaler holds the SCALED size on screen; .card is always the real 100 x 100 mm. */
      .scaler {
        position: relative;
        width: calc(100mm * var(--s));
        height: calc(100mm * var(--s));
        background: #fff;
        box-shadow:
          0 14px 30px -12px rgba(94, 66, 48, 0.55),
          0 2px 6px rgba(94, 66, 48, 0.2);
      }
      .card {
        position: absolute;
        left: 0;
        top: 0;
        width: 100mm;
        height: 100mm;
        overflow: hidden;
        transform-origin: 0 0;
        transform: scale(var(--s));
        background-color: var(--cream);
        /* subtle vintage dotted paper texture (the mirror area is covered by a plain cream disc below) */
        background-image: radial-gradient(
          rgba(118, 84, 58, 0.08) 0.17mm,
          transparent 0.22mm
        );
        background-size: 2mm 2mm;
      }
      /* Thin rounded border: sage line + dotted gold line (same pair as the invitation and banner) */
      .card::before {
        content: "";
        position: absolute;
        inset: 2mm;
        border: 0.3mm solid var(--sage);
        border-radius: 2.4mm;
        z-index: 0;
      }
      .card::after {
        content: "";
        position: absolute;
        inset: 2.9mm;
        border: 0.2mm dashed rgba(217, 164, 65, 0.8);
        border-radius: 1.6mm;
        z-index: 0;
      }
      .art {
        position: absolute;
        inset: 0;
        width: 100mm;
        height: 100mm;
        display: block;
        z-index: 1;
      }
      /* Mirror area: 70 mm circle, left 15 / top 6 / right 85 / bottom 76. Plain cream, nothing inside. */
      .mirror-area {
        position: absolute;
        left: 15mm;
        top: 6mm;
        width: 70mm;
        height: 70mm;
        border-radius: 50%;
        background: var(--cream);
        z-index: 1;
      }
      /* Alignment guide: preview only, hidden when printing */
      .mirror-guide {
        position: absolute;
        left: 15mm;
        top: 6mm;
        width: 70mm;
        height: 70mm;
        border-radius: 50%;
        border: 0.25mm dashed rgba(104, 121, 77, 0.55);
        z-index: 3;
        pointer-events: none;
      }
      .hide-guide .mirror-guide {
        display: none;
      }

      /* ---------- Bottom typography (77 to 97 mm) ---------- */
      .t {
        position: absolute;
        left: 0;
        width: 100mm;
        text-align: center;
        transform: translateY(-50%);
        white-space: nowrap;
        line-height: 1;
        z-index: 2;
      }
      .names {
        top: 81.2mm;
        font-family: var(--f-display);
        font-weight: 500;
        font-size: 6.4mm;
        letter-spacing: 0.08em;
        padding-left: 0.08em;
        color: var(--brown);
      }
      /* "&" in the same script style and honey colour as the banner */
      .names .amp {
        font-family: var(--f-script);
        font-weight: 700;
        font-style: normal;
        font-size: 1.12em;
        letter-spacing: 0;
        color: var(--honey);
        padding: 0 0.1em;
        position: relative;
        top: 0.04em;
      }
      .date {
        top: 88mm;
        font-family: var(--f-ui);
        font-weight: 700;
        font-size: 3.3mm;
        letter-spacing: 0.16em;
        padding-left: 0.16em;
        color: var(--brown);
      }
      /* Thank-you line: same handwritten style as "Welcome" on the banner
         (Dancing Script, weight 700, olive). One line, no letter-spacing. */
      .thanks {
        top: 93.4mm;
        font-family: var(--f-script);
        font-weight: 700;
        font-size: 3.6mm;
        letter-spacing: 0;
        color: var(--olive);
      }

      /* ---------- Print: exactly one 100 x 100 mm page ---------- */
      @page {
        size: 100mm 100mm;
        margin: 0;
      }
      @media print {
        :root {
          --s: 1 !important;
        }
        html,
        body {
          width: 100mm;
          height: 100mm;
          margin: 0;
          padding: 0;
          background: #fff;
          overflow: hidden;
        }
        .ui,
        .mirror-guide {
          display: none !important;
        }
        #stage {
          display: block;
          padding: 0;
          margin: 0;
        }
        .scaler {
          width: 100mm;
          height: 100mm;
          box-shadow: none;
          margin: 0;
          break-after: avoid;
          page-break-after: avoid;
          break-inside: avoid;
        }
        .card {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="ui">
      <div class="ui-card">
        <div>
          <p>
            <strong>Souvenir card, 10 × 10 cm.</strong> In the print dialog
            choose a custom paper size of 100 × 100 mm, margins None, scale
            100%, and turn on Background graphics. Mirror: 70 mm round, 6 mm
            from the top edge, centred.
          </p>
          <label
            ><input type="checkbox" id="guideChk" checked /> Show mirror guide
            (preview only, never printed)</label
          >
        </div>
        <button class="btn" id="printBtn" type="button">
          Print / Save as PDF
        </button>
      </div>
    </header>

    <main id="stage">
      <div class="scaler">
        <div class="card" id="card">
          <svg
            class="art"
            id="art"
            viewBox="0 0 100 100"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          ></svg>
          <div class="mirror-area" aria-hidden="true"></div>
          <div class="mirror-guide" aria-hidden="true"></div>

          <p class="t names">PUTRI <span class="amp">&amp;</span> YOGA</p>
          <p class="t date">17 JANUARY 2027</p>
          <p class="t thanks">Thank you for being part of our special day.</p>
        </div>
      </div>
    </main>

    <script>
      (function () {
        /* ---------- Vector artwork: same symbols as the invitation and banner ---------- */
        var art = document.getElementById("art");
        function f(n) {
          return Math.round(n * 100) / 100;
        }

        function sunflower() {
          var s = '<symbol id="sf" viewBox="-50 -50 100 100">',
            i;
          s += '<g fill="#D9A441">';
          for (i = 0; i < 14; i++)
            s +=
              '<ellipse cx="0" cy="-33" rx="8.2" ry="17" transform="rotate(' +
              (i * 360) / 14 +
              ')"/>';
          s += '</g><g fill="#F6C945">';
          for (i = 0; i < 14; i++)
            s +=
              '<ellipse cx="0" cy="-31" rx="7.6" ry="15.5" transform="rotate(' +
              ((i + 0.5) * 360) / 14 +
              ')"/>';
          s += "</g>";
          for (i = 0; i < 14; i++)
            s +=
              '<path d="M0 -20V-42" stroke="#D9A441" stroke-width=".9" opacity=".55" stroke-linecap="round" fill="none" transform="rotate(' +
              ((i + 0.5) * 360) / 14 +
              ')"/>';
          s +=
            '<circle r="18" fill="#76543A"/><circle r="14.5" fill="#5E4230"/>';
          [
            [5, "1.3 3.8"],
            [9, "1.7 4.0"],
            [12.5, "2 4.4"],
          ].forEach(function (a) {
            s +=
              '<circle r="' +
              a[0] +
              '" fill="none" stroke="#D9A441" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="' +
              a[1] +
              '" opacity=".9"/>';
          });
          return s + "</symbol>";
        }
        function daisy() {
          var s = '<symbol id="dz" viewBox="-50 -50 100 100">',
            i;
          for (i = 0; i < 10; i++)
            s +=
              '<ellipse cx="0" cy="-30" rx="7.2" ry="17" fill="#FFFDF5" stroke="#E0CE9A" stroke-width="1.2" transform="rotate(' +
              i * 36 +
              ')"/>';
          s +=
            '<circle r="12" fill="#F6C945" stroke="#D9A441" stroke-width="1.5"/><circle r="5" fill="#D9A441"/>';
          return s + "</symbol>";
        }
        var leafSym =
          '<symbol id="leaf" viewBox="0 0 40 28"><path d="M0 14C9 -2 28 -2 40 14 28 30 9 30 0 14Z" fill="#A8B58A"/><path d="M2 14H36" stroke="#68794D" stroke-width="1.3" stroke-linecap="round" opacity=".6"/></symbol>';
        var heartSym =
          '<symbol id="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.5 3 5 6.4 5c2 0 3.5 1.1 5.6 3.2C14.1 6.1 15.6 5 17.6 5 21 5 23 8.5 21.6 11.8 19.5 16.4 12 21 12 21z" fill="currentColor"/></symbol>';
        var starSym =
          '<symbol id="star" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.7-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.3l7.1-.7z" fill="currentColor"/></symbol>';

        var bflySym =
          '<symbol id="bfly" viewBox="0 0 60 40">' +
          '<path d="M30 20C22 4 6 2 4 12c-1 8 8 12 16 10-6 2-12 6-9 12 3 5 14 2 19-14z" fill="currentColor"/>' +
          '<path d="M30 20C38 4 54 2 56 12c1 8-8 12-16 10 6 2 12 6 9 12-3 5-14 2-19-14z" fill="currentColor"/>' +
          '<circle cx="14" cy="13" r="3" fill="#FFF8E7" opacity=".85"/><circle cx="46" cy="13" r="3" fill="#FFF8E7" opacity=".85"/>' +
          '<path d="M30 12v18" stroke="#76543A" stroke-width="2.4" stroke-linecap="round"/>' +
          '<path d="M30 12q-4-7-8-8M30 12q4-7 8-8" fill="none" stroke="#76543A" stroke-width="1.2" stroke-linecap="round"/></symbol>';

        // Corner cluster: same arrangement as the invitation's bouquet.
        // (ax, ay) = the cluster's corner anchor in mm; sx / sy = mirror flips; size in mm
        function bouquet(ax, ay, sx, sy, S) {
          function p(v) {
            return f((v / 100) * S);
          }
          function leaf(l, t, rot) {
            var w = (34 / 100) * S,
              h = (w * 28) / 40;
            return (
              '<use href="#leaf" x="' +
              p(l) +
              '" y="' +
              p(t) +
              '" width="' +
              f(w) +
              '" height="' +
              f(h) +
              '" transform="rotate(' +
              rot +
              " " +
              f(p(l) + w / 2) +
              " " +
              f(p(t) + h / 2) +
              ')"/>'
            );
          }
          function box(sym, l, t, w) {
            return (
              '<use href="#' +
              sym +
              '" x="' +
              p(l) +
              '" y="' +
              p(t) +
              '" width="' +
              p(w) +
              '" height="' +
              p(w) +
              '"/>'
            );
          }
          return (
            '<g transform="translate(' +
            ax +
            " " +
            ay +
            ") scale(" +
            sx +
            " " +
            sy +
            ')">' +
            leaf(46, 2, 25) +
            leaf(2, 50, 75) +
            leaf(42, 52, -20) +
            box("sf", 0, 0, 62) +
            box("sf", 48, 30, 38) +
            box("sf", 12, 58, 26) +
            box("dz", 62, 6, 15) +
            box("dz", 36, 70, 15) +
            "</g>"
          );
        }
        function deco(sym, x, y, w, rot, color) {
          var h = sym === "bfly" ? f((w * 2) / 3) : w; // butterflies are 3:2
          return (
            '<use href="#' +
            sym +
            '" x="' +
            x +
            '" y="' +
            y +
            '" width="' +
            w +
            '" height="' +
            h +
            '" style="color:' +
            color +
            '" transform="rotate(' +
            rot +
            " " +
            f(x + w / 2) +
            " " +
            f(y + h / 2) +
            ')"/>'
          );
        }

        var svg =
          "<defs>" +
          sunflower() +
          daisy() +
          leafSym +
          heartSym +
          starSym +
          bflySym +
          "</defs>";

        // Upper corners: larger clusters, kept clear of the 70 mm mirror circle
        svg += bouquet(3.4, 3.4, 1, 1, 23);
        svg += bouquet(96.6, 3.4, -1, 1, 23);

        // Tiny accents either side of the mirror
        // (stars replaced by butterflies, like the wedding sign; hearts kept)
        svg += deco("bfly", 5.4, 37, 6, -14, "#F5C6A5");
        svg += deco("bfly", 88.6, 37, 6, 14, "#A8B58A");
        svg += deco("heart", 6.6, 47, 2.6, 0, "#E9A88A");
        svg += deco("heart", 90.8, 47, 2.6, 0, "#E9A88A");

        art.innerHTML = svg;

        /* ---------- Preview scaling (never distorts the square) ---------- */
        var MM = 96 / 25.4,
          root = document.documentElement;
        function fit() {
          var ui = document.querySelector(".ui");
          var availW = Math.max(120, window.innerWidth - 32);
          var availH = Math.max(
            160,
            window.innerHeight - (ui ? ui.offsetHeight : 0) - 48,
          );
          var s = Math.min(availW / (100 * MM), availH / (100 * MM), 5);
          root.style.setProperty("--s", s.toFixed(5));
        }
        fit();
        window.addEventListener("resize", fit);
        window.addEventListener("beforeprint", function () {
          root.style.setProperty("--s", "1");
        });
        window.addEventListener("afterprint", fit);
        if (document.fonts && document.fonts.ready)
          document.fonts.ready.then(fit);

        document
          .getElementById("printBtn")
          .addEventListener("click", function () {
            window.print();
          });
        document
          .getElementById("guideChk")
          .addEventListener("change", function (e) {
            document
              .getElementById("card")
              .classList.toggle("hide-guide", !e.target.checked);
          });
      })();
    </script>
  </body>
</html>
